[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fleet-h1-router"
version = "0.1.0"
description = "Constraint-theory-driven fleet routing — route agents by H¹ cohomology"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Cocapn", email = "cocapn@proton.me"}
]
keywords = ["fleet", "routing", "h1", "cohomology", "constraint-theory", "laman", "emergence"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: System :: Networking",
]

dependencies = []

[project.scripts]
fleet-h1-router = "fleet_h1_router:serve"

[project.urls]
Homepage = "https://github.com/SuperInstance/fleet-h1-router"
Documentation = "https://github.com/SuperInstance/fleet-h1-router#readme"
Repository = "https://github.com/SuperInstance/fleet-h1-router"

[tool.setuptools]
packages = ["fleet_h1_router"]
package-dir = {"" = "src"}